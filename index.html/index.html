<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicas para Eletricistas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f4f4;
color:#333;
}

header{
background:#0d47a1;
color:white;
padding:25px;
text-align:center;
}

nav{
background:#1565c0;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

.banner{
background:#1976d2;
color:white;
padding:60px;
text-align:center;
}

section{
padding:40px;
}

h2{
margin-bottom:20px;
color:#0d47a1;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:white;
width:300px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,.2);
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
padding:15px;
color:#1565c0;
}

.card p{
padding:15px;
text-align:justify;
}

footer{
background:#0d47a1;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

ul{
margin-left:25px;
line-height:30px;
}
